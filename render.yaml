services:
  # ============================================================================
  # Django Backend Web Service
  # ============================================================================
  - type: web
    name: sme-backend
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --timeout 60
    envVars:
      # --- Secret Variables (set manually in Render Dashboard) ---
      - key: SECRET_KEY
        scope: all
        # IMPORTANT: Generate a strong SECRET_KEY in Render Dashboard
        # https://docs.djangoproject.com/en/stable/ref/settings/#secret-key
      
      # --- Django Configuration ---
      - key: DEBUG
        value: "0"
        scope: all
      
      - key: DJANGO_DEBUG
        value: "0"
        scope: all
      
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
        scope: all
        # Render will automatically add the RENDER_EXTERNAL_HOSTNAME
      
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "1"
        scope: all
      
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "1"
        scope: all
      
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "1"
        scope: all
      
      - key: DJANGO_LOG_LEVEL
        value: "WARNING"
        scope: all
      
      # --- CORS & CSRF Configuration ---
      # Set FRONTEND_URL to match your frontend Render Static Site URL
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:3000
        scope: all
        # Update this after frontend is deployed to Render
        # Format: https://your-frontend-name.onrender.com
      
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: http://localhost:5173,http://localhost:3000
        scope: all
        # Update this after frontend is deployed to Render
      
      # --- Database ---
      # DATABASE_URL is automatically provided by Render PostgreSQL service
      # Reference it like: $DATABASE_URL (see below in databases section)

  # ============================================================================
  # React Frontend Static Site
  # ============================================================================
  - type: static
    name: sme-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # API Base URL must point to the Django backend service
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sme-backend
          property: url
        scope: build
        # This will automatically reference the backend URL during build

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
databases:
  - name: sme-db
    databaseName: sme_scoring
    user: postgres
    # NOTE: Password is automatically generated by Render
    # It will be available as DATABASE_URL environment variable
    region: ohio # Change to your preferred region

# ============================================================================
# Post-Deployment Notes
# ============================================================================
#
# 1. IMPORTANT ENVIRONMENT VARIABLES TO SET IN RENDER DASHBOARD:
#
#    Backend Service (sme-backend):
#    - SECRET_KEY: Generate with Django's management command:
#      python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
#
# 2. UPDATE CORS AFTER FRONTEND DEPLOYMENT:
#
#    Once the frontend is deployed to Render, update in Dashboard:
#    - Backend service → Environment
#    - DJANGO_CORS_ALLOWED_ORIGINS: https://your-frontend-name.onrender.com
#    - DJANGO_CSRF_TRUSTED_ORIGINS: https://your-frontend-name.onrender.com
#
# 3. DATABASE CONNECTION:
#
#    The PostgreSQL service automatically provides DATABASE_URL
#    The Django backend is configured to use this URL
#
# 4. CUSTOM DOMAIN:
#
#    After deployment, you can add custom domains:
#    - Backend service → Settings → Custom Domains
#    - Frontend site → Settings → Custom Domains
#
# 5. FIRST REQUEST DELAY:
#
#    Render free web services may spin down after 15 minutes of inactivity.
#    The first request after spin-down may take 30+ seconds.
#    Upgrade to a paid plan to keep services always running.
#
