services:
  # ============================================================================
  # Django Backend Web Service
  # ============================================================================
  - type: web
    name: sme-backend
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --timeout 60
    envVars:
      # --- Secret Variables ---
      - key: SECRET_KEY
        generateValue: true
      
      # --- Database Connection (Auto-provided by PostgreSQL service) ---
      - key: DATABASE_URL
        fromDatabase:
          name: sme-db
          property: connectionString
      
      # --- Django Configuration ---
      - key: DEBUG
        value: "0"
      
      - key: DJANGO_DEBUG
        value: "0"
      
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
        # Render will automatically add the RENDER_EXTERNAL_HOSTNAME
      
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "1"
      
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "1"
      
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "1"
      
      - key: DJANGO_LOG_LEVEL
        value: "WARNING"
      
      # --- CORS & CSRF Configuration ---
      # Set to match your frontend Render Static Site URL after deployment
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:3000
        # Update this after frontend is deployed to Render
        # Format: https://your-frontend-name.onrender.com
      
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: http://localhost:5173,http://localhost:3000
        # Update this after frontend is deployed to Render
        # Format: https://your-frontend-name.onrender.com

  # ============================================================================
  # React Frontend Static Site
  # ============================================================================
  - type: web
    name: sme-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this manually during initial Blueprint creation after the backend URL is known
      - key: VITE_API_BASE_URL
        sync: false

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
databases:
  - name: sme-db
    databaseName: sme_scoring
    region: ohio
    # Note: Password is auto-generated by Render
    # DATABASE_URL is automatically injected into backend service
    # Format: postgresql://user:password@host:port/database

# ============================================================================
# Post-Deployment Configuration Guide
# ============================================================================
#
# 1. SET ENVIRONMENT VARIABLES IN RENDER DASHBOARD
#
#    During initial Blueprint creation, provide VITE_API_BASE_URL when prompted.
#    Set any additional values in the Backend Service → Environment if needed:
#
#    Backend Service (sme-backend):
#    - SECRET_KEY is generated automatically by Render.
#
# 2. DATABASE CONNECTION
#
#    ✅ DATABASE_URL is AUTOMATICALLY PROVIDED by the PostgreSQL service
#    ✅ Backend service receives it via fromDatabase declaration
#    ✅ Django is configured to use DATABASE_URL (see backend/config/settings.py)
#    ✅ Migrations run automatically during build.sh
#
# 3. FRONTEND-TO-BACKEND COMMUNICATION
#
#    ✅ VITE_API_BASE_URL is provided manually during initial Blueprint creation
#    ✅ Use the deployed backend URL, for example:
#       https://sme-backend-XXXX.onrender.com
#
# 4. CORS CONFIGURATION (Post-Deployment)
#
#    After both services are deployed:
#    1. Note the frontend URL: https://sme-frontend-XXXX.onrender.com
#    2. Go to Backend Service → Environment
#    3. Update DJANGO_CORS_ALLOWED_ORIGINS:
#       https://sme-frontend-XXXX.onrender.com
#    4. Update DJANGO_CSRF_TRUSTED_ORIGINS:
#       https://sme-frontend-XXXX.onrender.com
#    5. Save (Render auto-redeploys backend)
#
# 5. TESTING AFTER DEPLOYMENT
#
#    Frontend: https://sme-frontend-XXXX.onrender.com
#    Backend API: https://sme-backend-XXXX.onrender.com/api/
#    Health Check: https://sme-backend-XXXX.onrender.com/api/health/
#
# 6. CUSTOM DOMAINS (Optional)
#
#    Backend Service → Settings → Custom Domains
#    Frontend Site → Settings → Custom Domains
#
# 7. AUTO-DEPLOY (Recommended)
#
#    Backend Service → Settings → Auto-Deploy: Yes
#    Frontend Site → Settings → Auto-Deploy: Yes
#
